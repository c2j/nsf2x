name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.3.6)'
        required: false
        default: ''

jobs:
  build-x86:
    runs-on: windows-latest
    name: Build x86 (32-bit)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.9 (32-bit)
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        architecture: 'x86'
        
    - name: Install NSIS
      run: |
        choco install nsis -y
        echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywin32 py2exe
        
    - name: Determine version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event.inputs.version }}") {
          $version = "${{ github.event.inputs.version }}"
        } elseif ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
          $version = $env:GITHUB_REF.Substring("refs/tags/v".Length)
        } else {
          $version = "1.3.6-dev"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Building version: $version"
        
    - name: Update version in create_exe.py
      shell: python
      run: |
        import re
        version = "${{ steps.version.outputs.VERSION }}"
        with open('create_exe.py', 'r') as f:
            content = f.read()
        content = re.sub(r'version = "[^"]+"', f'version = "{version}"', content)
        with open('create_exe.py', 'w') as f:
            f.write(content)
        print(f"Updated version to: {version}")

    - name: Generate README.txt from README.md
      run: python md2txt.py README.md README.txt

    - name: Build helper
      run: python create_helper.py

    - name: Build main executable
      run: python create_exe.py

    - name: List build outputs
      run: |
        Get-ChildItem -Path dist -Recurse
        Get-ChildItem -Path helper32 -Recurse -ErrorAction SilentlyContinue

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nsf2x-x86-${{ steps.version.outputs.VERSION }}
        path: |
          dist/
          nsf2x-*-x86.zip
          nsf2x-*-x86-setup.exe
        if-no-files-found: warn
        retention-days: 30

    - name: Upload release assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          nsf2x-*-x86.zip
          nsf2x-*-x86-setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-amd64:
    runs-on: windows-latest
    name: Build amd64 (64-bit)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.9 (64-bit)
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        architecture: 'x64'
        
    - name: Install NSIS
      run: |
        choco install nsis -y
        echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywin32 py2exe
        
    - name: Determine version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event.inputs.version }}") {
          $version = "${{ github.event.inputs.version }}"
        } elseif ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
          $version = $env:GITHUB_REF.Substring("refs/tags/v".Length)
        } else {
          $version = "1.3.6-dev"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Building version: $version"
        
    - name: Update version in create_exe.py
      shell: python
      run: |
        import re
        version = "${{ steps.version.outputs.VERSION }}"
        with open('create_exe.py', 'r') as f:
            content = f.read()
        content = re.sub(r'version = "[^"]+"', f'version = "{version}"', content)
        with open('create_exe.py', 'w') as f:
            f.write(content)
        print(f"Updated version to: {version}")

    - name: Generate README.txt from README.md
      run: python md2txt.py README.md README.txt

    - name: Build helper
      run: python create_helper.py

    - name: Build main executable
      run: python create_exe.py

    - name: List build outputs
      run: |
        Get-ChildItem -Path dist -Recurse
        Get-ChildItem -Path helper64 -Recurse -ErrorAction SilentlyContinue

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nsf2x-amd64-${{ steps.version.outputs.VERSION }}
        path: |
          dist/
          nsf2x-*-amd64.zip
          nsf2x-*-amd64-setup.exe
        if-no-files-found: warn
        retention-days: 30

    - name: Upload release assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          nsf2x-*-amd64.zip
          nsf2x-*-amd64-setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-combined:
    runs-on: windows-latest
    name: Build combined package
    needs: [build-x86, build-amd64]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        merge-multiple: true

    - name: List downloaded artifacts
      run: Get-ChildItem -Path artifacts/ -Recurse

    - name: Create combined release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/**/*.zip
          artifacts/**/*.exe
        body: |
          ## NSF2X Release

          ### 下载选项
          - **x86 (32-bit)**: 适用于 32 位 Lotus Notes
          - **amd64 (64-bit)**: 适用于 64 位 Lotus Notes

          ### 文件说明
          - `nsf2x-VERSION-ARCH.zip`: 便携版 ZIP 压缩包
          - `nsf2x-VERSION-ARCH-setup.exe`: Windows 安装程序

          ### 系统要求
          - Windows 操作系统
          - Lotus Notes（必需）
          - Microsoft Outlook（仅在转换为 PST 格式时需要）
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
